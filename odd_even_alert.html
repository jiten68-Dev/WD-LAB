<!DOCTYPE html>
<html>
    <head>
        <title> Check odd even</title>
    </head>
    <body>
        <script>
            
                let num = prompt("enter your number");
                if(Number(num) % 2 == 0){
                    alert("even");
                }else{
                    alert("odd")
                }
            
        </script>
    </body>
</html>
